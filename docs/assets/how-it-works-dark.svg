<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="320" viewBox="0 0 1300 320" font-family="Cantarell, 'Noto Sans', 'DejaVu Sans', sans-serif"><rect width="1300" height="320" fill="#1a1a19"/><text x="40" y="52" font-size="26" font-weight="700" fill="#f0efec" text-anchor="start">How it works</text><text x="40" y="82" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">A virtual microphone in PipeWire; the hardware and other apps are untouched.</text><rect x="40" y="110" width="230" height="116" rx="14" fill="#242423" stroke="#383835" stroke-width="2"/><text x="155" y="136" font-size="17" font-weight="700" fill="#f0efec" text-anchor="middle">Built-in mic (stereo)</text><text x="64" y="172" font-size="17" font-weight="700" fill="#f0efec" text-anchor="start">L</text><text x="88" y="172" font-size="15" font-weight="400" fill="#c3c2b7" text-anchor="start">hiss only</text><text x="64" y="204" font-size="17" font-weight="700" fill="#f0efec" text-anchor="start">R</text><text x="88" y="204" font-size="15" font-weight="400" fill="#c3c2b7" text-anchor="start">your voice</text><line x1="270" y1="167" x2="318" y2="167" stroke="#5d5c58" stroke-width="2" stroke-dasharray="4 4"/><path d="M322 159 l16 16 M338 159 l-16 16" stroke="#5d5c58" stroke-width="3"/><line x1="270" y1="199" x2="360" y2="199" stroke="#a58cf0" stroke-width="2"/><path d="M358 192 L370 199 L358 206 Z" fill="#a58cf0"/><rect x="370" y="120" width="190" height="96" rx="14" fill="#242423" stroke="#383835" stroke-width="2"/><text x="465.0" y="164.0" font-size="19" font-weight="700" fill="#f0efec" text-anchor="middle">Right channel</text><text x="465.0" y="190.0" font-size="15" font-weight="400" fill="#c3c2b7" text-anchor="middle">mono, no hiss</text><line x1="560" y1="168.0" x2="600" y2="168.0" stroke="#a58cf0" stroke-width="2"/><path d="M598 161.0 L610 168.0 L598 175.0 Z" fill="#a58cf0"/><rect x="610" y="120" width="190" height="96" rx="14" fill="#242423" stroke="#383835" stroke-width="2"/><text x="705.0" y="164.0" font-size="19" font-weight="700" fill="#f0efec" text-anchor="middle">High-pass</text><text x="705.0" y="190.0" font-size="15" font-weight="400" fill="#c3c2b7" text-anchor="middle">120 Hz, removes hum</text><line x1="800" y1="168.0" x2="840" y2="168.0" stroke="#a58cf0" stroke-width="2"/><path d="M838 161.0 L850 168.0 L838 175.0 Z" fill="#a58cf0"/><rect x="850" y="120" width="150" height="96" rx="14" fill="#242423" stroke="#383835" stroke-width="2" stroke-dasharray="7 6"/><text x="925.0" y="164.0" font-size="19" font-weight="700" fill="#f0efec" text-anchor="middle">RNNoise</text><text x="925.0" y="190.0" font-size="15" font-weight="400" fill="#c3c2b7" text-anchor="middle">optional</text><line x1="1000" y1="168.0" x2="1040" y2="168.0" stroke="#a58cf0" stroke-width="2"/><path d="M1038 161.0 L1050 168.0 L1038 175.0 Z" fill="#a58cf0"/><rect x="1050" y="120" width="210" height="96" rx="14" fill="#242423" stroke="#a58cf0" stroke-width="2"/><text x="1155.0" y="164.0" font-size="19" font-weight="700" fill="#f0efec" text-anchor="middle">Internal mic (fixed)</text><text x="1155.0" y="190.0" font-size="15" font-weight="400" fill="#c3c2b7" text-anchor="middle">what apps use</text><text x="40" y="290" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">Gain: the physical input is set to 20% (+18 dB) instead of up to +60 dB, so it no longer clips.</text></svg>
