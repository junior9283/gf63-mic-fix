name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  NFPM_VERSION: 2.48.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-bin \
            python3-pytest gettext gnupg pipewire pipewire-bin pulseaudio-utils
      - name: Lint
        run: |
          pipx run ruff check .
          pipx run ruff format --check .
      - name: Tests (including the window, off-screen)
        run: python3 -m pytest -q

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nfpm (checksum verified)
        run: |
          base=https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION
          curl -fsSLO "$base/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "$base/checksums.txt"
          grep " nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz$" checksums.txt | sha256sum -c -
          sudo tar -xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -C /usr/local/bin nfpm
          rm -f nfpm_*.tar.gz checksums.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext zstd
      - name: Build packages
        run: packaging/build.sh "$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/gf63_mic_fix/__init__.py)" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  install:
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case: [fedora-rpm, ubuntu-deb, debian-deb, arch-pkg, fedora-universal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install in a clean container and run the app
        run: ONLY=${{ matrix.case }} tests/packaging/test_install.sh dist
