name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Tag, code version and changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/gf63_mic_fix/__init__.py)
          top=$(sed -n 's/^## \[\([0-9.]*\)\].*/\1/p' CHANGELOG.md | head -1)
          echo "tag=$version code=$code changelog=$top"
          [ "$version" = "$code" ] && [ "$version" = "$top" ]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  release:
    needs: [check, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Tools
        run: sudo apt-get install -y -qq rpm createrepo-c apt-utils gnupg
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME=$(mktemp -d)
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --homedir "$GNUPGHOME" --batch --import
      - name: Sign
        run: scripts/sign-release.sh dist
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## \[/ { on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish the GitHub release
        run: gh release create "v$VERSION" dist/* --title "GF63 Mic Fix $VERSION" --notes-file notes.md --verify-tag
      - name: Update the apt and dnf repositories (gh-pages)
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          scripts/update-repos.sh dist site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Packages $VERSION"
          git push -q origin gh-pages
